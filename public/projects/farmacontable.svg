<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#2d2520"/>
    </linearGradient>
  </defs>
  <rect width="480" height="280" fill="url(#bg)"/>
  <!-- Pill / capsule decoration -->
  <g transform="translate(360,90)" stroke="#d97757" stroke-width="2" fill="none">
    <rect x="-50" y="-22" width="100" height="44" rx="22" stroke-opacity="0.85"/>
    <line x1="0" y1="-22" x2="0" y2="22" stroke-opacity="0.85"/>
    <rect x="-50" y="-22" width="50" height="44" rx="22" fill="#d97757" fill-opacity="0.18" stroke="none"/>
  </g>
  <!-- Receipt lines -->
  <g transform="translate(330,170)" stroke="#d97757" stroke-width="1.6" fill="none" stroke-opacity="0.7">
    <line x1="0" y1="0" x2="100" y2="0"/>
    <line x1="0" y1="14" x2="80" y2="14"/>
    <line x1="0" y1="28" x2="100" y2="28"/>
    <line x1="0" y1="42" x2="60" y2="42"/>
  </g>
  <g transform="translate(40,60)" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#faf9f5">
    <text font-size="13" font-weight="600" letter-spacing="3" fill="#b0aea5">DESKTOP APP · PYTHON · TKINTER</text>
    <text y="44" font-size="42" font-weight="800">Farmacontable</text>
    <text y="80" font-size="15" font-weight="500" fill="#e8e6dc">Contabilidad para farmacias offline</text>
  </g>
</svg>
