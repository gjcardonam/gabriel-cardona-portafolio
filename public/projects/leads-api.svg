<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0"/>
      <stop offset="50%" stop-color="#86efac" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#86efac" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="280" fill="url(#bg)"/>
  <!-- Funnel shape suggesting marketing leads -->
  <g transform="translate(330,40)" stroke="#86efac" stroke-width="2" fill="none">
    <path d="M0 0 L120 0 L72 70 L72 130 L48 130 L48 70 Z" stroke-opacity="0.85"/>
    <circle cx="60" cy="155" r="3" fill="#86efac"/>
    <circle cx="60" cy="170" r="3" fill="#86efac"/>
    <circle cx="60" cy="185" r="3" fill="#86efac"/>
  </g>
  <!-- Connection line decoration -->
  <line x1="40" y1="220" x2="450" y2="220" stroke="url(#line)" stroke-width="1.5"/>
  <g transform="translate(40,60)" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#f1f5f9">
    <text font-size="13" font-weight="600" letter-spacing="3" fill="#94a3b8">REST API · NESTJS · TYPESCRIPT</text>
    <text y="44" font-size="42" font-weight="800">Leads API</text>
    <text y="80" font-size="15" font-weight="500" fill="#cbd5e1">Embudos de marketing · resúmenes con IA</text>
  </g>
</svg>
